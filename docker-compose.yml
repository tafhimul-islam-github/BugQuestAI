version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bugquest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bugquest_ai}
      POSTGRES_USER: ${DB_USERNAME:-bugquest_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bugquest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bugquest_user} -d ${DB_DATABASE:-bugquest_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis Cache & Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bugquest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bugquest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Laravel REST API Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: bugquest-backend
    restart: unless-stopped
    environment:
      APP_NAME: "BugQuest AI"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bugquest_ai}
      DB_USERNAME: ${DB_USERNAME:-bugquest_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-isolated_sandbox}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bugquest-network

  # ----------------------------------------------------------------------------
  # FastAPI AI Coaching Service
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../infrastructure/docker/ai-service.Dockerfile
    container_name: bugquest-ai-service
    restart: unless-stopped
    environment:
      PORT: 8001
      AI_PROVIDER: ${AI_PROVIDER:-fallback_simulated}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8001:8001"
    networks:
      - bugquest-network

  # ----------------------------------------------------------------------------
  # Frontend (Vite / Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: bugquest-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - bugquest-network

networks:
  bugquest-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
